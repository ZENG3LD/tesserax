[package]
name = "tesserax-http"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "HTTP surface for tesserax servers: self-describing routes, OpenAPI from the route table, SSE / WebSocket hubs with resume, security guards, caching and tracing middleware, static assets, optional CORS proxy and response signing."
keywords = ["backend", "server", "http", "openapi", "sse"]
categories = ["web-programming::http-server"]
readme = "README.md"

[features]
default = []
# Same-origin reverse proxy for browser clients (outbound HTTP via reqwest).
cors-proxy = ["dep:reqwest", "dep:percent-encoding"]
# Signed responses (ed25519 over a canonical form) with a tesserax-secrets identity.
signing = ["dep:tesserax-secrets"]
# Prometheus request metrics and a scrape endpoint.
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]

[dependencies]
tesserax = { path = "../tesserax", version = "0.1.1" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "matched-path", "query", "ws"] }
tower-http = { version = "0.6", default-features = false, features = ["cors", "set-header", "fs", "compression-gzip", "compression-deflate"] }
tower-layer = "0.3"
tower-service = "0.3"
tokio = { version = "1", default-features = false, features = ["sync", "time", "macros", "rt"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
getrandom = "0.3"
base64 = "0.22"
tesserax-secrets = { path = "../tesserax-secrets", version = "0.1.1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
percent-encoding = { version = "2", optional = true }
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.16", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tesserax-auth = { path = "../tesserax-auth", version = "0.1.1" }
tokio-tungstenite = "0.29"
reqwest = { version = "0.12", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
