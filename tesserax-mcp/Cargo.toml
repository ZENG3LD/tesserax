[package]
name = "tesserax-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "MCP (Model Context Protocol) JSON-RPC 2.0 server for tesserax: stateless tool dispatch with compact, byte-capped results, a tools/list size budget, self-described tiered routes and the admitted caller handed to every tool."
keywords = ["mcp", "jsonrpc", "agent", "server", "axum"]
categories = ["web-programming::http-server"]
readme = "README.md"

[dependencies]
tesserax = { path = "../tesserax", version = "0.1.1" }
tesserax-http = { path = "../tesserax-http", version = "0.1.1" }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "matched-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tesserax-auth = { path = "../tesserax-auth", version = "0.1.1" }
